name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Flake check
      run: nix flake check
    - name: Nix build
      run: nix build '.#default' '.#ensaio-mcp'
    - name: cargo fmt
      run: nix develop --command cargo fmt --all -- --check
    - name: cargo test
      run: nix develop --command cargo test --workspace
